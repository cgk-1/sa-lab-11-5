name: daily

on:
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day to append, YYYY-MM-DD (blank = yesterday)"
        type: string
        default: ""
      write:
        description: "false = dry run: fetch, build and check, upload nothing"
        type: boolean
        default: true
  # Owner-approved. 08:23 UTC: yesterday's UTC day as soon as its last analysis hour is published (about 06Z) and
  # before the 09:00-10:30 quiet window of the station archive. 17:13 UTC: a retry that only redoes groups that are
  # still incomplete (late files, an upstream outage in the morning). Never the top of the hour.
  schedule:
    - cron: "23 8 * * *"
    - cron: "13 17 * * *"

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  catalog:
    # Station catalogues first: the gridded lane reads them for its station cells.
    runs-on: ubuntu-24.04
    environment: archive
    timeout-minutes: 30
    steps:
      - name: Get this commit
        run: |
          git init -q code
          git -C code fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git -C code checkout -q FETCH_HEAD
      - name: Install hash-pinned dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --no-deps --require-hashes -r code/requirements.lock
      - name: Station catalogues
        env:
          LANE: catalog
          WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_KEY_ID: ${{ secrets.S3_KEY_ID }}
          S3_SECRET: ${{ secrets.S3_SECRET }}
        run: cd code && ../.venv/bin/python -E -m feeder.run

  noaa:
    needs: catalog
    runs-on: ubuntu-24.04
    environment: archive
    timeout-minutes: 120
    steps:
      - name: Get this commit
        run: |
          git init -q code
          git -C code fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git -C code checkout -q FETCH_HEAD
      - name: Install hash-pinned dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --no-deps --require-hashes -r code/requirements.lock
      - name: Offline self-test
        run: cd code && ../.venv/bin/python -E -m feeder.selftest
      - name: Append day D (NOAA), check D-3 ETags, verify
        env:
          LANE: daily-noaa
          IN_DAY: ${{ inputs.day }}
          WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_KEY_ID: ${{ secrets.S3_KEY_ID }}
          S3_SECRET: ${{ secrets.S3_SECRET }}
        run: cd code && ../.venv/bin/python -E -m feeder.daily

  iem:
    needs: catalog
    runs-on: ubuntu-24.04
    environment: archive
    timeout-minutes: 120
    steps:
      - name: Get this commit
        run: |
          git init -q code
          git -C code fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git -C code checkout -q FETCH_HEAD
      - name: Install hash-pinned dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --no-deps --require-hashes -r code/requirements.lock
      - name: Offline self-test
        run: cd code && ../.venv/bin/python -E -m feeder.selftest
      - name: Append day D (observations + others), re-pull D+3/8/36/120, verify D + 7 seeded days, write the index
        env:
          LANE: daily-iem
          IN_DAY: ${{ inputs.day }}
          WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
          REFRESH_OFFSETS: "3,8,36,120"
          VERIFY_SEEDED_DAYS: "7"
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_KEY_ID: ${{ secrets.S3_KEY_ID }}
          S3_SECRET: ${{ secrets.S3_SECRET }}
        run: cd code && ../.venv/bin/python -E -m feeder.daily

  madis:
    # Mesonet table of D (and of recent days still incomplete); its own job, so a slow or absent archive day never
    # holds up the other lanes. The next daily-iem run indexes it.
    runs-on: ubuntu-24.04
    environment: archive
    timeout-minutes: 120
    steps:
      - name: Get this commit
        run: |
          git init -q code
          git -C code fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git -C code checkout -q FETCH_HEAD
      - name: Install hash-pinned dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --no-deps --require-hashes -r code/requirements.lock
      - name: Offline self-test
        run: cd code && ../.venv/bin/python -E -m feeder.selftest
      - name: Append day D (mesonet), retry incomplete recent days
        env:
          LANE: daily-madis
          IN_DAY: ${{ inputs.day }}
          WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_KEY_ID: ${{ secrets.S3_KEY_ID }}
          S3_SECRET: ${{ secrets.S3_SECRET }}
        run: cd code && ../.venv/bin/python -E -m feeder.daily

  keepalive:
    # Public repos: scheduled workflows are disabled after 60 days without repository activity.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow on the 3rd of each month
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d)" = "03" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/daily.yml/enable"
          fi
